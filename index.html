<style>

:block;font-size:26px;margin:7px 0}.green{color:#267c55}.amber{color:#9d691a}.section{margin-top:18px;padding:20px}.section h2{font-size:16px;margin:0 0 4px}.review-list{display:grid;gap:10px;margin-top:15px}.review{border:1px solid #e8ebf0;border-radius:10px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.review p{margin:7px 0;color:#505c70;font-size:13px;line-height:1.5}.review small{color:#9aa3b1}.badge{display:inline-block;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:800}.flag{background:#fff0df;color:#9b651a}.safe{background:#e9f6ef;color:#287b55}.danger{background:#fbe8e8;color:#b33e3e}.actions{display:flex;gap:7px;align-items:center}.hidden{display:none}.form{display:grid;gap:12px;max-width:760px}.form textarea{min-height:150px;resize:vertical;border:1px solid #dfe4ec;border-radius:9px;padding:12px}.result{padding:15px;border-radius:10px;background:#f7f8fb;border:1px solid #e6e9ef}.result strong{display:block;margin-bottom:6px}.case{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #edf0f4}.case:first-child{border-top:0}.status{padding:5px 8px;border-radius:6px;background:#eef1f8;font-size:10px;font-weight:800}.empty{padding:45px;text-align:center;color:#8b94a3}

<body>
<style>
<style>
.auth-screen{
    position:fixed;
    inset:0;
    display:grid;
    place-items:center;
    z-index:50;
    overflow:hidden;
    isolation:isolate;
    background:#050914;
}

.login-bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    background:
        radial-gradient(circle at 15% 20%,rgba(44,111,255,.22),transparent 30%),
        radial-gradient(circle at 85% 75%,rgba(255,55,75,.16),transparent 30%),
        linear-gradient(135deg,#030711,#081321 55%,#030711);
}

.map-grid{
    position:absolute;
    inset:-15%;
    opacity:.20;
    background-image:
        linear-gradient(rgba(90,150,255,.18) 1px,transparent 1px),
        linear-gradient(90deg,rgba(90,150,255,.18) 1px,transparent 1px);
    background-size:90px 90px;
    transform:perspective(900px) rotateX(58deg) rotateZ(-8deg) scale(1.4);
    mask-image:linear-gradient(to bottom,transparent,black 20%,black 80%,transparent);
}

.road{
    position:absolute;
    height:2px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(70,145,255,.65),
        rgba(70,145,255,.15),
        transparent
    );
    box-shadow:0 0 12px rgba(70,145,255,.2);
}

.road.r1{width:75%;top:25%;left:-5%;transform:rotate(13deg)}
.road.r2{width:85%;top:58%;left:15%;transform:rotate(-17deg)}
.road.r3{width:65%;top:75%;left:-5%;transform:rotate(7deg)}
.road.r4{width:70%;top:42%;left:45%;transform:rotate(28deg)}

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    pointer-events:none;
}

.glow.blue{
    width:350px;
    height:350px;
    background:#1264ff;
    opacity:.18;
    top:-100px;
    left:-80px;
}

.glow.red{
    width:300px;
    height:300px;
    background:#ff304b;
    opacity:.14;
    right:-70px;
    bottom:-80px;
}

.security-label{
    position:absolute;
    top:28px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border:1px solid rgba(80,140,255,.22);
    border-radius:30px;
    background:rgba(7,15,29,.55);
    color:#9db8e8;
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    backdrop-filter:blur(12px);
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    white-space:nowrap;
}

.center-brand{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
    opacity:.09;
}

.shield{
    width:190px;
    height:220px;
    margin:auto;
    border:2px solid #4f8cff;
    clip-path:polygon(
        50% 0%,
        90% 15%,
        88% 60%,
        50% 100%,
        12% 60%,
        10% 15%
    );
    box-shadow:
        0 0 35px rgba(60,130,255,.5),
        inset 0 0 30px rgba(60,130,255,.12);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
}

.review-alert{
    position:absolute;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 17px;
    background:rgba(8,18,34,.72);
    border:1px solid rgba(255,255,255,.09);
    border-radius:14px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
        0 20px 50px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.06);
    animation:float 6s ease-in-out infinite;
    z-index:1;
}

.review-alert .icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    font-size:18px;
}

.review-alert strong{
    display:block;
    font-size:12px;
    letter-spacing:.2px;
    color:#f4f7ff;
}

.review-alert span{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#8f9db2;
}

.alert-negative{
    top:17%;
    left:8%;
    border-color:rgba(255,65,82,.25);
}

.alert-negative .icon{
    background:rgba(255,50,70,.12);
    color:#ff5265;
}

.alert-fake{
    right:7%;
    top:30%;
    animation-delay:1s;
    border-color:rgba(255,174,60,.22);
}

.alert-fake .icon{
    background:rgba(255,174,60,.10);
    color:#ffb84c;
}

.alert-spam{
    left:7%;
    bottom:19%;
    animation-delay:2s;
    border-color:rgba(115,100,255,.27);
}

.alert-spam .icon{
    background:rgba(115,100,255,.12);
    color:#8d7cff;
}

.alert-protected{
    right:8%;
    bottom:17%;
    animation-delay:3s;
    border-color:rgba(40,220,155,.22);
}

.alert-protected .icon{
    background:rgba(40,220,155,.10);
    color:#32dfa1;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#5c9cff;
    border-radius:50%;
    box-shadow:0 0 12px #4f8cff;
    animation:particleMove 8s linear infinite;
}

.p1{left:20%;top:10%}
.p2{left:34%;top:80%;animation-delay:2s}
.p3{left:70%;top:15%;animation-delay:4s}
.p4{left:82%;top:65%;animation-delay:1s}
.p5{left:52%;top:25%;animation-delay:3s}
.p6{left:12%;top:58%;animation-delay:5s}

@keyframes particleMove{
    0%{opacity:0;transform:translateY(20px)}
    30%{opacity:1}
    70%{opacity:.8}
    100%{opacity:0;transform:translateY(-80px)}
}

/* POLISHED LOGIN CARD */
.auth-box{
    position:relative;
    z-index:5;
    width:min(430px,92vw);
    background:rgba(8,18,34,.88);
    border:1px solid rgba(120,160,230,.18);
    border-radius:20px;
    padding:30px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 60px rgba(40,100,255,.08),
        inset 0 1px rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    color:#fff;
}

.auth-box .logo{
    margin-bottom:18px;
    background:linear-gradient(135deg,#4f8cff,#315fc7);
    box-shadow:0 8px 25px rgba(79,140,255,.3);
}

.auth-box h1{
    margin:0 0 7px;
    font-size:25px;
    color:#fff;
}

.auth-box p{
    font-size:13px;
    line-height:1.5;
    color:#8f9db2;
}

.auth-form{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.auth-form label{
    font-size:12px;
    font-weight:700;
    color:#b9c6da;
}

.auth-form input{
    width:100%;
    border:1px solid rgba(130,155,195,.18);
    border-radius:9px;
    padding:12px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:#fff;
    transition:.2s;
}

.auth-form input::placeholder{
    color:#65748b;
}

.auth-form input:focus{
    border-color:#4f8cff;
    box-shadow:0 0 0 3px rgba(79,140,255,.10);
    background:rgba(255,255,255,.065);
}

.auth-form .primary{
    margin-top:5px;
    background:linear-gradient(135deg,#4f8cff,#3568d4);
    box-shadow:0 10px 25px rgba(52,104,212,.25);
    transition:.2s;
}

.auth-form .primary:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 30px rgba(52,104,212,.35);
}

.auth-error{
    color:#ff6978;
    font-size:11px;
    min-height:16px;
}

.auth-switch{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#7f8da2;
}

.auth-switch button{
    border:0;
    background:none;
    color:#6fa0ff;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:700px){
    .review-alert{transform:scale(.82)}
    .alert-negative{left:-25px}
    .alert-fake{right:-30px}
    .alert-spam{left:-30px}
    .alert-protected{right:-30px}
    .center-brand{opacity:.05}
    .security-label{white-space:nowrap}
}

@media(max-width:500px){
    .auth-box{
        padding:24px;
        border-radius:17px;
    }

    .review-alert{
        opacity:.7;
        transform:scale(.7);
    }
}
</style>
