<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReviewShield AI — Phase 2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#172033}
button,input,textarea,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#fff;border-right:1px solid #e6e9ef;padding:22px 15px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.brand{font-weight:800;font-size:17px;padding:0 10px 28px;display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:9px;background:#172033;color:white;display:grid;place-items:center}.nav button{width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:9px;color:#687386;cursor:pointer;font-weight:650}.nav button.active{background:#eef1f8;color:#172033}.bottom{margin-top:auto}.plan{padding:14px;border:1px solid #e7eaf0;border-radius:12px;background:#fafbfc;margin-bottom:12px}.plan small{display:block;color:#8b94a3}.plan button,.primary{background:#172033;color:#fff;border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.plan button{width:100%;margin-top:9px}.user{display:flex;gap:9px;align-items:center;padding:6px}.avatar{width:33px;height:33px;border-radius:50%;background:#dfe4ee;display:grid;place-items:center;font-weight:800}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:68px;background:#fff;border-bottom:1px solid #e6e9ef;padding:0 32px;display:flex;justify-content:space-between;align-items:center}.business{font-size:13px}.business strong{margin-left:8px}.topright{display:flex;gap:9px;align-items:center}.ghost{border:1px solid #e3e7ee;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}.page{padding:30px;max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.head h1{margin:0 0 5px;font-size:26px}.muted{color:#7d8798}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;color:#9aa3b1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:12px}.stat{padding:18px}.stat small{color:#8a94a5}.stat strong{display:block;font-size:26px;margin:7px 0}.green{color:#267c55}.amber{color:#9d691a}.section{margin-top:18px;padding:20px}.section h2{font-size:16px;margin:0 0 4px}.review-list{display:grid;gap:10px;margin-top:15px}.review{border:1px solid #e8ebf0;border-radius:10px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.review p{margin:7px 0;color:#505c70;font-size:13px;line-height:1.5}.review small{color:#9aa3b1}.badge{display:inline-block;padding:5px 8px;border-radius:6px;font-size:10px;font-weight:800}.flag{background:#fff0df;color:#9b651a}.safe{background:#e9f6ef;color:#287b55}.danger{background:#fbe8e8;color:#b33e3e}.actions{display:flex;gap:7px;align-items:center}.hidden{display:none}.form{display:grid;gap:12px;max-width:760px}.form textarea{min-height:150px;resize:vertical;border:1px solid #dfe4ec;border-radius:9px;padding:12px}.result{padding:15px;border-radius:10px;background:#f7f8fb;border:1px solid #e6e9ef}.result strong{display:block;margin-bottom:6px}.case{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid #edf0f4}.case:first-child{border-top:0}.status{padding:5px 8px;border-radius:6px;background:#eef1f8;font-size:10px;font-weight:800}.empty{padding:45px;text-align:center;color:#8b94a3}
@media(max-width:900px){.side{width:72px}.brand span:last-child,.nav button span,.plan,.user div:last-child{display:none}.nav button{text-align:center}.main{margin-left:72px;width:calc(100% - 72px)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.page{padding:18px}.stats{grid-template-columns:1fr}.head{gap:12px;flex-direction:column}.review{grid-template-columns:1fr}}

</head>
<body>
<style>
<style>
.auth-screen{
   <div class="login-bg">

  <div class="map-grid"></div>

  <div class="road r1"></div>
  <div class="road r2"></div>
  <div class="road r3"></div>
  <div class="road r4"></div>

  <div class="glow blue"></div>
  <div class="glow red"></div>

  <div class="security-label">
    AI-Powered Reputation Protection
  </div>

  <div class="center-brand">
    <div class="shield">🛡️</div>
  </div>

  <div class="review-alert alert-negative">
    <div class="icon">★</div>
    <div>
      <strong>Negative Review Detected</strong>
      <span>Potential reputation risk</span>
    </div>
  </div>

  <div class="review-alert alert-fake">
    <div class="icon">⚠</div>
    <div>
      <strong>Fake Review Alert</strong>
      <span>Suspicious activity detected</span>
    </div>
  </div>

  <div class="review-alert alert-spam">
    <div class="icon">✦</div>
    <div>
      <strong>Spam Review Blocked</strong>
      <span>AI analysis completed</span>
    </div>
  </div>

  <div class="review-alert alert-protected">
    <div class="icon">✓</div>
    <div>
      <strong>Business Protected</strong>
      <span>Reputation monitoring active</span>
    </div>
  </div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>

</div>

/* POLISHED LOGIN CARD */
.auth-box{
    position:relative;
    z-index:5;
    width:min(430px,92vw);
    background:rgba(8,18,34,.88);
    border:1px solid rgba(120,160,230,.18);
    border-radius:20px;
    padding:30px;
    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        0 0 60px rgba(40,100,255,.08),
        inset 0 1px rgba(255,255,255,.07);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);
    color:#fff;
}

.auth-box .logo{
    margin-bottom:18px;
    background:linear-gradient(135deg,#4f8cff,#315fc7);
    box-shadow:0 8px 25px rgba(79,140,255,.3);
}

.auth-box h1{
    margin:0 0 7px;
    font-size:25px;
    color:#fff;
}

.auth-box p{
    font-size:13px;
    line-height:1.5;
    color:#8f9db2;
}

.auth-form{
    display:grid;
    gap:10px;
    margin-top:20px;
}

.auth-form label{
    font-size:12px;
    font-weight:700;
    color:#b9c6da;
}

.auth-form input{
    width:100%;
    border:1px solid rgba(130,155,195,.18);
    border-radius:9px;
    padding:12px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:#fff;
    transition:.2s;
}

.auth-form input::placeholder{
    color:#65748b;
}

.auth-form input:focus{
    border-color:#4f8cff;
    box-shadow:0 0 0 3px rgba(79,140,255,.10);
    background:rgba(255,255,255,.065);
}

.auth-form .primary{
    margin-top:5px;
    background:linear-gradient(135deg,#4f8cff,#3568d4);
    box-shadow:0 10px 25px rgba(52,104,212,.25);
    transition:.2s;
}

.auth-form .primary:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 30px rgba(52,104,212,.35);
}

.auth-error{
    color:#ff6978;
    font-size:11px;
    min-height:16px;
}

.auth-switch{
    text-align:center;
    margin-top:15px;
    font-size:12px;
    color:#7f8da2;
}

.auth-switch button{
    border:0;
    background:none;
    color:#6fa0ff;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:700px){
    .review-alert{transform:scale(.82)}
    .alert-negative{left:-25px}
    .alert-fake{right:-30px}
    .alert-spam{left:-30px}
    .alert-protected{right:-30px}
    .center-brand{opacity:.05}
    .security-label{white-space:nowrap}
}

@media(max-width:500px){
    .auth-box{
        padding:24px;
        border-radius:17px;
    }

    .review-alert{
        opacity:.7;
        transform:scale(.7);
    }
}
</style>
